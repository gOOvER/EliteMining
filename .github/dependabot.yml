# GitHub Dependabot configuration for EliteMining
# Automatically creates pull requests for dependency updates

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "02:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    target-branch: "develop"
    reviewers:
      - "gOOvER"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    reviewers:
      - "gOOvER"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Custom update rules for specific packages
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "develop"
    allow:
      # Only security updates for critical packages
      - dependency-name: "requests"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "pywin32"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    ignore:
      # Ignore major version updates for matplotlib (can break compatibility)
      - dependency-name: "matplotlib"
        update-types: ["version-update:semver-major"]